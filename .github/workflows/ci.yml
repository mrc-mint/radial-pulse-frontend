name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sets NX_BASE/NX_HEAD so `nx affected` compares against the last green main.
      - uses: nrwl/nx-set-shas@v4

      - name: Formatting
        run: pnpm format:check

      - name: API contract in sync
        run: pnpm contract:check

      # Lints known-bad imports/globals through the real ESLint config and checks
      # declared workspace dependencies against actual imports.
      - name: Architecture rules enforced
        run: pnpm architecture:check

      - name: Lint, typecheck, test, build, Studio bundle check (affected)
        run: pnpm nx affected -t lint typecheck test build verify-bundle --parallel=3

# Deploy workflows are added once the dev environment exists. V1 deploys
# Studio only (apps/web → S3 + CloudFront via GitHub OIDC); Clinic
# (apps/mobile → EAS) is V2 and only runs lint/typecheck/test in CI. Prod deploys will be gated by a
# GitHub Environment with required reviewers.
